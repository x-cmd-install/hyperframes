6-c4sgEE5","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:85fcfe5e0829f4ca5070d18cb8146180f000a33b9c55bc27f0adddcb17b17f11","download_count":2,"created_at":"2026-11-14T06:50:14Z","updated_at":"2026-11-14T06:50:14Z"},{"id":746602807,"node_id":"RA_kwDORi26-c4sgEE3","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":130997918,"digest":"sha256:c9a690046b4e38f2c99fda8343720823e6f4dfd4b58af09cbc8d7d7420600e3a","download_count":2,"created_at":"2026-11-14T06:50:14Z","updated_at":"2026-11-14T06:50:19Z"},{"id":746603090,"node_id":"RA_kwDORi26-c4sgEJS","name":"hyperframes-lambda-video-arm64.oci.tar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-tar","state":"uploaded","size":246138880,"digest":"sha256:232a51a00bbe602c70ea9e7b038b3f93f25a78b25b29c19f38b11bec92eaa163","download_count":3,"created_at":"2026-11-14T06:50:20Z","updated_at":"2026-11-14T06:50:29Z"},{"id":746603093,"node_id":"RA_kwDORi26-c4sgEJV","name":"hyperframes-lambda-video-arm64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":105,"digest":"sha256:4a6447bafc3d6efe40f76167c5a40001f580df56885a4197eed1c5e5b711d3da","download_count":2,"created_at":"2026-11-14T06:50:20Z","updated_at":"2026-11-14T06:50:21Z"}],"body":"# HyperFrames v0.9.44\n\nReleased on 2026-11-14.\n\nCheck now warns when text leaves the safe areas of a 9:16 social video. Previews free a clip's decoder once the playhead leaves it, and a cancelled audio fade no longer crashes the page. Set HYPERFRAMES_OWNER to tell which run started a leftover browser.\n\n## Features\n\n- **CLI:** Name a caller's owner id on the browsers and warm check it starts ([798c241e4d0cf](https://github.com/heygen-com/hyperframes/commit/798c241e4d0cf18fc328d90c41823a766a9d8d8e), [#7687](https://github.com/heygen-com/hyperframes/pull/7687)).\n- **CLI:** Check warns when text leaves the 9:16 social safe areas ([45882027bd284](https://github.com/heygen-com/hyperframes/commit/45882027bd284a8fbd96ffe854184104304c224f), [#7680](https://github.com/heygen-com/hyperframes/pull/7680)).\n\n## Fixes\n\n- **Studio:** Edit clips added to a project outside Studio ([cb072eb047efa](https://github.com/heygen-com/hyperframes/commit/cb072eb047efafe9749ae81613ccbb8036be3e21), [#7686](https://github.com/heygen-com/hyperframes/pull/7686)).\n- **Core:** Stop a cancelled audio envelope from crashing the page ([49623307ce86c](https://github.com/heygen-com/hyperframes/commit/49623307ce86c030f8016c3e21b6aa1120806d5c), [#7682](https://github.com/heygen-com/hyperframes/pull/7682)).\n- **Core:** Free a preview clip's decoder when the playhead leaves it ([f7b49f12078e1](https://github.com/heygen-com/hyperframes/commit/f7b49f12078e14cdc401808edd4f217df8d24ce4), [#7679](https://github.com/heygen-com/hyperframes/pull/7679)).\n\n## Performance\n\n- **Core:** A reloaded preview video resyncs only itself ([92816ed56bde0](https://github.com/heygen-com/hyperframes/commit/92816ed56bde07affff0f6e0a5bce3dd96a96808), [#7684](https://github.com/heygen-com/hyperframes/pull/7684)).\n\n## Catalog\n\n- **CLI:** Report an invalid catalog --type as a usage error ([affa03b60fb08](https://github.com/heygen-com/hyperframes/commit/affa03b60fb082c93b1efa9341ac85a106dda61e), [#7678](https://github.com/heygen-com/hyperframes/pull/7678)).\n- Publish the hosted HyperFrames MCP to the official MCP registry ([0f6ed7d57bc9c](https://github.com/heygen-com/hyperframes/commit/0f6ed7d57bc9c6d449ce89cbfc3a7948a7427157), [#7676](https://github.com/heygen-com/hyperframes/pull/7676)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.9.43...v0.9.44\n"}
