Z"},{"id":801641393,"node_id":"RA_kwDORi26-c4vyBOx","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:b0ce5926994e8cdfb9b75ea370a78d0138dea49050ccca758bb90708091f2071","download_count":7,"created_at":"2026-11-27T18:46:37Z","updated_at":"2026-11-27T18:46:37Z"},{"id":801641200,"node_id":"RA_kwDORi26-c4vyBLw","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":132452719,"digest":"sha256:4aa120391c9cb1ee0233b134c2e041068d1097aca1d7d07f6668fcf17f05ea21","download_count":15,"created_at":"2026-11-27T18:46:32Z","updated_at":"2026-11-27T18:46:36Z"},{"id":801641456,"node_id":"RA_kwDORi26-c4vyBPw","name":"hyperframes-lambda-video-arm64.oci.tar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":396224000,"digest":"sha256:b9a49df60556c528144d11e15b74f2a2fd94beb018a1158d963385d1495e97aa","download_count":9,"created_at":"2026-11-27T18:46:38Z","updated_at":"2026-11-27T18:46:48Z"},{"id":801641964,"node_id":"RA_kwDORi26-c4vyBXs","name":"hyperframes-lambda-video-arm64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":105,"digest":"sha256:b9aa9557d2531358b8c60cd1f43b439c68097b043648ff0645d81810319055a2","download_count":10,"created_at":"2026-11-27T18:46:49Z","updated_at":"2026-11-27T18:46:49Z"}],"body":"# HyperFrames v0.9.104\n\nReleased on 2026-11-27.\n\nA sealed canvas drag keeps its drop again, sealed previews load as fast as open ones, and Studio's server stops blocking on waveform reads. Timeline clips load media only from their own project, and a busy preview reload retries after the server's wait.\n\n## Features\n\n- **Core:** A frame-presented wait can be asked to run longer, up to 15 s ([4c92e37a7](https://github.com/heygen-com/hyperframes/commit/4c92e37a708662240c1a96d53d0565332a1aea8d), [#8976](https://github.com/heygen-com/hyperframes/pull/8976)).\n- **Parsers:** Export the size the renderer compiles a composition at ([a7cca1a2e](https://github.com/heygen-com/hyperframes/commit/a7cca1a2e47e7275de366623508e1cb075fa717f), [#8974](https://github.com/heygen-com/hyperframes/pull/8974)).\n\n## Fixes\n\n- **Share:** Wait for the host's export lookup, so a host can read its disk off its main thread ([cfaefdc56](https://github.com/heygen-com/hyperframes/commit/cfaefdc56dc93d74aeedc537123097f2ab74470b), [#8984](https://github.com/heygen-com/hyperframes/pull/8984)).\n- **CLI:** Billing add-credits offers a free account no add-on checkout the server refuses ([dfe324acb](https://github.com/heygen-com/hyperframes/commit/dfe324acb96c32697a9124d4bcce2b921630ce1e), [#8983](https://github.com/heygen-com/hyperframes/pull/8983)).\n- **Studio:** A preview reload the server answered busy asks again after its Retry-After ([bdcc53b4d](https://github.com/heygen-com/hyperframes/commit/bdcc53b4d51ca4ee2dd94e0d8675f6d7afcae777), [#8982](https://github.com/heygen-com/hyperframes/pull/8982)).\n- **Studio Server:** Cached waveform and preview reads never hold the server's thread ([32ec0b983](https://github.com/heygen-com/hyperframes/commit/32ec0b9835fddf4a58ac3d754cf27284dd784374), [#8971](https://github.com/heygen-com/hyperframes/pull/8971)).\n- **Studio:** A sealed canvas drag keeps its drop when the keyboard moves into the frame ([b4f47cec1](https://github.com/heygen-com/hyperframes/commit/b4f47cec1f0fc6ac1dff91de597423b7edc460c5), [#8978](https://github.com/heygen-com/hyperframes/pull/8978)).\n- **Core:** The preview runtime's editing port ignores later changes to MessagePort and window.parent ([23f665d0a](https://github.com/heygen-com/hyperframes/commit/23f665d0a2dd62dbd00a8e8eb51cd7d8e74a8279), [#8963](https://github.com/heygen-com/hyperframes/pull/8963)).\n- **Studio:** Sealed previews start loading as fast as open ones ([407c0efb7](https://github.com/heygen-com/hyperframes/commit/407c0efb7dd82dfff8e5ad7dcf1404fa643ff9fb), [#8972](https://github.com/heygen-com/hyperframes/pull/8972)).\n- **Studio:** A timeline clip loads media only from its own project's files ([413d37bad](https://github.com/heygen-com/hyperframes/commit/413d37badb84f29db4a463800753c3d703c9eb21), [#8970](https://github.com/heygen-com/hyperframes/pull/8970)).\n- **Parsers:** Css parsing ignores source-map comments in the stylesheet ([626644b2d](https://github.com/heygen-com/hyperframes/commit/626644b2da0ed86fe542264f3757e994ddf0fb11), [#8969](https://github.com/heygen-com/hyperframes/pull/8969)).\n\n## Catalog\n\n- Redirect renamed catalog items and moved guides to their current pages ([1cb750bba](https://github.com/heygen-com/hyperframes/commit/1cb750bbae3ab2aaecc19f300d8cc2a55adab08b), [#8975](https://github.com/heygen-com/hyperframes/pull/8975)).\n\n## Internal\n\n- **CLI:** The skills git-folder test runs git without the lookup's 4 s cut-off ([32274984f](https://github.com/heygen-com/hyperframes/commit/32274984f8e189ae471f1c962650ed910fb29933), [#8966](https://github.com/heygen-com/hyperframes/pull/8966)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.9.103...v0.9.104\n"}
